# Capital Data Studio reverse proxy
#
# Install on the GPU host as /etc/nginx/conf.d/data-platform.conf.
# Gunicorn must listen privately on 127.0.0.1:8013.

upstream capital_data_studio {
    server 127.0.0.1:8013;
    keepalive 16;
}

server {
    listen 8010;
    server_name 10.0.30.100;

    client_max_body_size 50M;

    location / {
        proxy_pass http://capital_data_studio;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://capital_data_studio/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
